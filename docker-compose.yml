services:
  mysql:
    image: mysql:8.4
    container_name: pvz-mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=pvz_db
      - MYSQL_USER=pvz_user
      - MYSQL_PASSWORD=pvz_password
      - MYSQL_ROOT_PASSWORD=root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: pvz-automation-web:mysqlready
    container_name: pvz-automation
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DB_ENGINE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=pvz_db
      - MYSQL_USER=pvz_user
      - MYSQL_PASSWORD=pvz_password

volumes:
  mysql_data:
