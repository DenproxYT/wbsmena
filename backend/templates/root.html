{% extends 'base.html' %}

{% block content %}
<div class="row fade-in">
  <div class="col-12">
    <div class="row g-4">
      {% for l in links %}
      <div class="col-md-6 col-lg-4">
        <a href="{{ l.url }}" class="text-decoration-none">
          <div class="card card-shadow h-100">
            <div class="card-body p-4">
              <div class="d-flex justify-content-between align-items-start mb-3">
                <div class="flex-grow-1">
                  <h4 class="mb-2 fw-bold text-primary">{{ l.title }}</h4>
                  <p class="text-muted mb-0">{{ l.desc }}</p>
                </div>
                <div class="ms-3">
                  <div class="bg-primary bg-opacity-10 rounded-circle p-3">
                    <i class="bi bi-box-arrow-up-right fs-4 text-primary"></i>
                  </div>
                </div>
              </div>
              <div class="mt-3">
                <span class="text-primary fw-semibold">
                  Перейти <i class="bi bi-arrow-right"></i>
                </span>
              </div>
            </div>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
