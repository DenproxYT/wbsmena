{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-shadow p-4">
      <h3 class="mb-3">Вход в систему</h3>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Логин или Email</label>
          <input class="form-control" name="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input class="form-control" name="password" type="password" required>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <span class="text-muted small">Доступ выдает администратор</span>
          <button class="btn btn-primary">Войти</button>
        </div>
      </form>
      <div id="msg" class="mt-3"></div>
    </div>
  </div>
</div>

<script>
const formLogin = document.getElementById('loginForm')
formLogin.addEventListener('submit', async (e)=>{
  e.preventDefault()
  const data = Object.fromEntries(new FormData(formLogin))
  try {
  const res = await fetch('/api/accounts/login/', { method:'POST', headers:{'Content-Type':'application/json', 'X-CSRFToken': window.getCSRF()}, body: JSON.stringify(data) })
    const j = await res.json()
    if(res.ok){
      document.getElementById('msg').innerHTML = '<div class="alert alert-success">Успешный вход</div>'
      if (j.must_change_credentials) {
        setTimeout(()=> location.href='/accounts/first-login/', 300)
        return
      }
      const next = new URLSearchParams(window.location.search).get('next') || '/'
      setTimeout(()=> location.href=next, 600)
    } else {
      document.getElementById('msg').innerHTML = '<div class="alert alert-danger">'+(j.detail||JSON.stringify(j))+'</div>'
    }
  } catch(e){
    document.getElementById('msg').innerHTML = '<div class="alert alert-danger">Ошибка сети</div>'
  }
})
</script>

{% endblock %}
