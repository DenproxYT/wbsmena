{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-shadow p-4">
      <h3 class="mb-3">Создать аккаунт</h3>
      <p class="text-muted">Заполните данные сотрудника для доступа к системе.</p>
      <form id="registerForm">
        <div class="row">
          <div class="mb-3 col-md-6">
            <label class="form-label">Логин</label>
            <input class="form-control" name="username" required>
          </div>
          <div class="mb-3 col-md-6">
            <label class="form-label">Телефон</label>
            <input class="form-control" name="phone_number" required placeholder="+7...">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" name="email" type="email">
        </div>
        <div class="row">
          <div class="mb-3 col-md-6">
            <label class="form-label">Пароль</label>
            <input class="form-control" name="password" type="password" required>
          </div>
          <div class="mb-3 col-md-6">
            <label class="form-label">ПВЗ (адрес)</label>
            <select class="form-select" name="pvz_address">
              <option>PVZ 1</option>
              <option>PVZ 2</option>
              <option>PVZ 3</option>
            </select>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <a href="/accounts/login/{% if next_url %}?next={{ next_url }}{% endif %}" class="text-decoration-none">Уже есть аккаунт?</a>
          <button class="btn btn-primary">Зарегистрироваться</button>
        </div>
      </form>
      <div id="msg" class="mt-3"></div>
    </div>
  </div>
  <div class="col-md-4 d-none d-md-block">
    <div class="card card-shadow p-4">
      <h5>Советы</h5>
      <ul class="mb-0">
        <li>Используйте рабочий email.</li>
        <li>Телефон нужен для оперативной связи.</li>
      </ul>
    </div>
  </div>
</div>

<script>
const form = document.getElementById('registerForm')
form.addEventListener('submit', async (e) => {
  e.preventDefault()
  const data = Object.fromEntries(new FormData(form))
  try {
  const res = await fetch('/api/accounts/register/', { method:'POST', headers:{'Content-Type':'application/json', 'X-CSRFToken': window.getCSRF()}, body: JSON.stringify(data) })
    const j = await res.json()
    if (res.ok) {
      document.getElementById('msg').innerHTML = '<div class="alert alert-success">Успешно. Можете войти.</div>'
      const next = new URLSearchParams(window.location.search).get('next') || ''
      const loginUrl = '/accounts/login/' + (next ? '?next=' + encodeURIComponent(next) : '')
      setTimeout(()=> location.href = loginUrl, 900)
    } else {
      document.getElementById('msg').innerHTML = '<div class="alert alert-danger">'+(j.detail || JSON.stringify(j))+'</div>'
    }
  } catch (err) {
    document.getElementById('msg').innerHTML = '<div class="alert alert-danger">Ошибка сети</div>'
  }
})
</script>

{% endblock %}
