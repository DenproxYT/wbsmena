{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-shadow p-4">
      <h3 class="mb-2">Первый вход</h3>
      <p class="text-muted">Задайте свой логин и постоянный пароль.</p>
      <form id="firstLoginForm">
        <div class="mb-3">
          <label class="form-label">Текущий временный пароль</label>
          <input class="form-control" id="fCurrentPassword" type="password" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Новый логин</label>
          <input class="form-control" id="fNewUsername" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Новый пароль</label>
          <input class="form-control" id="fNewPassword" type="password" minlength="6" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Повторите пароль</label>
          <input class="form-control" id="fConfirmPassword" type="password" minlength="6" required>
        </div>
        <button class="btn btn-primary">Сохранить и войти</button>
      </form>
      <div id="msg" class="mt-3"></div>
    </div>
  </div>
</div>

<script>
document.getElementById('firstLoginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const p1 = document.getElementById('fNewPassword').value;
  const p2 = document.getElementById('fConfirmPassword').value;
  if (p1 !== p2) {
    document.getElementById('msg').innerHTML = '<div class="alert alert-danger">Пароли не совпадают.</div>';
    return;
  }
  const payload = {
    current_password: document.getElementById('fCurrentPassword').value,
    new_username: document.getElementById('fNewUsername').value.trim(),
    new_password: p1
  };
  const res = await fetch('/api/accounts/first-login/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': window.getCSRF() },
    body: JSON.stringify(payload)
  });
  const data = await res.json().catch(() => ({}));
  if (res.ok) {
    document.getElementById('msg').innerHTML = '<div class="alert alert-success">Данные обновлены.</div>';
    setTimeout(function() { location.href = '/'; }, 500);
  } else {
    document.getElementById('msg').innerHTML = '<div class="alert alert-danger">' + (data.detail || JSON.stringify(data)) + '</div>';
  }
});
</script>
{% endblock %}
